seed: 42
data:
  raw_dir: data/raw
  processed_dir: data/processed
  min_length: 100
  max_length: 5000
split:
  train: 0.7
  val: 0.15
  test: 0.15
  cluster_identity: 0.98  # Jaccard threshold; sequences above this go into the same cluster
features:
  kmer_size: 5
  use_tfidf: true
model:
  type: logistic_regression
  max_iter: 1000
  C: 1.0  # fallback if param_grid is absent
  param_grid:
    C: [0.01, 0.1, 1.0, 10.0, 100.0]
